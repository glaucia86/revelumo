name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node 24 without persistent cache
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Versions
        id: versions
        run: |
          node --version
          npm --version
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})' |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'node-versions.txt')

      - name: Check documentation links and language navigation
        id: docs
        run: npm run check:docs

      - name: npm ci
        id: install
        run: npm ci

      - name: npm run install:electron
        id: electron
        run: npm run install:electron

      - name: npm run typecheck
        id: typecheck
        run: npm run typecheck

      - name: npm test
        id: tests
        # Windows' default TEMP can use an 8.3 username alias while realpath
        # returns the long name. Use the isolated runner directory consistently.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          npm test 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'core-tests.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: npm run package
        id: package
        run: npm run package

      - name: 'Reproducible JPEG workflow: package, first and reopen'
        if: runner.os == 'Windows'
        id: jpeg_workflow_windows
        timeout-minutes: 8
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          npm run test:jpeg-workflow 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'jpeg-workflow.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'Ubuntu JPEG workflow: verify real graphics and sandbox prerequisites'
        if: runner.os == 'Linux'
        id: jpeg_workflow_linux
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/jpeg-workflow.txt"
          probe="$RUNNER_TEMP/jpeg-graphics-probe.txt"
          if ! command -v xvfb-run >/dev/null; then
            printf '%s\n' '{"stage":"jpeg-workflow","status":"skipped","reason":"xvfb-run is unavailable; graphical JPEG first/reopen was not run on Ubuntu"}' | tee "$log"
            exit 0
          fi
          # A hidden window still needs graphics and Chromium sandbox support.
          # No sysctl, permissions changes or --no-sandbox fallback is allowed.
          if xvfb-run -a node_modules/electron/dist/electron test/electron-graphics-probe.cjs >"$probe" 2>&1; then
            cat "$probe" | tee "$log"
            xvfb-run -a npm run test:jpeg-workflow 2>&1 | tee -a "$log"
          else
            cat "$probe" | tee "$log"
            if node scripts/classify-graphics-failure.mjs "$probe" | tee -a "$log"; then
              : # Only the specifically verified SUID-helper abort is classified.
            else
              echo 'Unexpected graphics probe failure; failing CI.' | tee -a "$log"
              exit 1
            fi
          fi

      - name: Create fresh synthetic Windows smoke directories
        if: runner.os == 'Windows'
        id: smoke_dirs
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('revelumo-smokes-' + [guid]::NewGuid())
          $electron = Join-Path $root 'electron'
          $relocation = Join-Path $root 'relocation'
          $exposure = Join-Path $root 'exposure'
          $history = Join-Path $root 'history'
          New-Item -ItemType Directory -Path $electron, $relocation, $exposure, $history | Out-Null
          "ELECTRON_SMOKE_DIR=$electron" >> $env:GITHUB_ENV
          "RELOCATION_SMOKE_DIR=$relocation" >> $env:GITHUB_ENV
          "EXPOSURE_SMOKE_DIR=$exposure" >> $env:GITHUB_ENV
          "HISTORY_SMOKE_DIR=$history" >> $env:GITHUB_ENV

      - name: Packaged filters and exposure integration in two processes
        if: runner.os == 'Windows'
        id: filters
        run: |
          $filters = Join-Path $env:RUNNER_TEMP ('revelumo-filters-' + [guid]::NewGuid())
          "FILTERS_SMOKE_DIR=$filters" >> $env:GITHUB_ENV
          npm run test:filters -- "$filters" first
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:filters -- "$filters" reopen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'Cobre catalog: real import, keyboard, states and minimum layout'
        if: runner.os == 'Windows'
        id: cobre_catalog
        run: |
          $catalog = Join-Path $env:RUNNER_TEMP ('revelumo-cobre-' + [guid]::NewGuid())
          npm run test:cobre-catalog -- "$catalog"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content -LiteralPath (Join-Path $catalog 'result.json') >> $env:GITHUB_STEP_SUMMARY

      - name: 'npm run test:electron -- <fresh directory> first'
        if: runner.os == 'Windows'
        id: electron_first
        run: npm run test:electron -- "$env:ELECTRON_SMOKE_DIR" first

      - name: 'npm run test:electron -- <same directory> reopen'
        if: runner.os == 'Windows'
        id: electron_reopen
        run: npm run test:electron -- "$env:ELECTRON_SMOKE_DIR" reopen

      - name: 'npm run test:relocation -- <separate fresh directory> first'
        if: runner.os == 'Windows'
        id: relocation_first
        run: npm run test:relocation -- "$env:RELOCATION_SMOKE_DIR" first

      - name: 'npm run test:relocation -- <same relocation directory> reopen'
        if: runner.os == 'Windows'
        id: relocation_reopen
        run: npm run test:relocation -- "$env:RELOCATION_SMOKE_DIR" reopen

      - name: 'Exposure: pixels, color, EXIF, IPC and autosave in hidden packaged Electron'
        if: runner.os == 'Windows'
        id: exposure_first
        timeout-minutes: 3
        run: npm run test:exposure -- "$env:EXPOSURE_SMOKE_DIR" first

      - name: 'Exposure: reopen, interruption, discard and navigation-close races'
        if: runner.os == 'Windows'
        id: exposure_persistence
        timeout-minutes: 5
        run: |
          # Every invocation is a separate real Electron process. Sequence is
          # significant: race persists 1.7 EV; race-reopen verifies that value.
          foreach ($mode in @('reopen', 'interrupt', 'reopen', 'discard-race', 'reopen', 'race', 'race-reopen')) {
            Write-Output "Exposure persistence mode: $mode"
            npm run test:exposure -- "$env:EXPOSURE_SMOKE_DIR" $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 'Exposure history: gestures, restart, interruption and retry races'
        if: runner.os == 'Windows'
        id: history
        timeout-minutes: 5
        run: |
          foreach ($mode in @('first', 'reopen', 'gestures', 'history-failure', 'history-reopen', 'interrupt', 'interrupt-reopen', 'save-failure', 'many-pending', 'key-chord', 'retention', 'retention-reopen')) {
            Write-Output "Exposure history mode: $mode"
            npm run test:history -- "$env:HISTORY_SMOKE_DIR" $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 'White balance: full recipe, preview, restart, keyboard and queue races'
        if: runner.os == 'Windows'
        id: white_balance
        timeout-minutes: 5
        run: |
          $wb = Join-Path $env:RUNNER_TEMP ('revelumo-wb-' + [guid]::NewGuid())
          "WB_SMOKE_DIR=$wb" >> $env:GITHUB_ENV
          foreach ($mode in @('first', 'reopen', 'controls', 'preview-race', 'save-race', 'history-ack', 'keyboard', 'many-pending', 'close-race', 'close-reopen', 'color', 'layout')) {
            Write-Output "White balance mode: $mode"
            npm run test:wb -- "$wb" $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 'Language: persistent PT-BR/EN/ES catalog, faults and state preservation'
        if: runner.os == 'Windows'
        id: language
        timeout-minutes: 5
        run: |
          $language = Join-Path $env:RUNNER_TEMP ('revelumo-language-' + [guid]::NewGuid())
          foreach ($mode in @('first', 'reopen')) {
            npm run test:language -- "$language" $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $system = Join-Path $env:RUNNER_TEMP ('revelumo-system-language-' + [guid]::NewGuid())
          foreach ($mode in @('system-first', 'system-reopen')) {
            npm run test:language -- "$system" $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($mode in @('fallback', 'os-error', 'boot-error', 'corrupt', 'future', 'oversized')) {
            $profile = Join-Path $env:RUNNER_TEMP ('revelumo-language-' + $mode + '-' + [guid]::NewGuid())
            npm run test:language -- "$profile" $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 'Editor language: drafts, history, faults, relocation and close'
        if: runner.os == 'Windows'
        id: editor_language
        timeout-minutes: 3
        run: |
          $editorLanguage = Join-Path $env:RUNNER_TEMP ('revelumo-editor-language-' + [guid]::NewGuid())
          npm run test:editor-language -- "$editorLanguage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'JPEG engine: isolated packaged full-resolution lifecycle'
        if: runner.os == 'Windows'
        id: jpeg_engine
        timeout-minutes: 3
        run: |
          $jpegEngine = Join-Path $env:RUNNER_TEMP ('revelumo-jpeg-engine-' + [guid]::NewGuid())
          npm run test:jpeg-engine -- "$jpegEngine" full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'JPEG export circuit: authenticated credits and exclusive publication'
        if: runner.os == 'Windows'
        id: jpeg_export_circuit
        timeout-minutes: 3
        run: |
          $jpegCircuit = Join-Path $env:RUNNER_TEMP ('revelumo-jpeg-circuit-' + [guid]::NewGuid())
          npm run test:jpeg-export-circuit -- "$jpegCircuit" full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'JPEG export UI: revision, destination, cancellation and IPC recovery'
        if: runner.os == 'Windows'
        id: jpeg_export_ui
        timeout-minutes: 3
        run: |
          $jpegUi = Join-Path $env:RUNNER_TEMP ('revelumo-jpeg-ui-' + [guid]::NewGuid())
          npm run test:jpeg-export-ui -- "$jpegUi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Results and limits
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          CHECKED_SHA: ${{ github.sha }}
        run: |
          "## CI — $env:RUNNER_OS / $(Get-Date -AsUTC -Format o)" >> $env:GITHUB_STEP_SUMMARY
          "Checked SHA: $env:CHECKED_SHA" >> $env:GITHUB_STEP_SUMMARY
          'PR runs check the GitHub merge ref; push/manual runs check their selected ref.' >> $env:GITHUB_STEP_SUMMARY
          '| Step | Outcome |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | --- |' >> $env:GITHUB_STEP_SUMMARY
          $results = $env:STEP_RESULTS | ConvertFrom-Json -AsHashtable
          foreach ($id in @('versions', 'docs', 'install', 'electron', 'typecheck', 'tests', 'package', 'smoke_dirs', 'filters', 'cobre_catalog', 'electron_first', 'electron_reopen', 'relocation_first', 'relocation_reopen', 'exposure_first', 'exposure_persistence', 'history', 'white_balance', 'language', 'editor_language', 'jpeg_engine', 'jpeg_export_circuit', 'jpeg_export_ui', 'jpeg_workflow_windows', 'jpeg_workflow_linux')) {
            "| $id | $($results[$id].outcome) |" >> $env:GITHUB_STEP_SUMMARY
          }
          if ($env:RUNNER_OS -ne 'Windows') {
            'The legacy Electron smokes are Windows-only. The reproducible JPEG workflow has its own Ubuntu prerequisite probe and result below; a prerequisite skip is not a workflow pass.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Core FIFO import/preview tests skip on Windows because they require POSIX mkfifo. Symlink alias tests may skip when Windows denies symlink creation; the test log records whether that happened.' >> $env:GITHUB_STEP_SUMMARY
          }
          'Other skipped steps did not run because a prerequisite failed or the job was cancelled; consult the step logs.' >> $env:GITHUB_STEP_SUMMARY
          foreach ($file in @('node-versions.txt', 'core-tests.txt', 'jpeg-workflow.txt')) {
            $path = Join-Path $env:RUNNER_TEMP $file
            if (Test-Path -LiteralPath $path) {
              "### $file (includes actual test totals and skip reasons)" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content -LiteralPath $path >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
          foreach ($dir in @($env:ELECTRON_SMOKE_DIR, $env:RELOCATION_SMOKE_DIR, $env:EXPOSURE_SMOKE_DIR, $env:FILTERS_SMOKE_DIR)) {
            if (!$dir) { continue }
            foreach ($file in @('first-result.json', 'reopen-result.json', 'interrupt-result.json', 'discard-race-result.json', 'race-result.json', 'race-reopen-result.json', 'first-failure.txt', 'reopen-failure.txt', 'interrupt-failure.txt', 'discard-race-failure.txt', 'race-failure.txt', 'race-reopen-failure.txt')) {
              $path = Join-Path $dir $file
              if (Test-Path -LiteralPath $path) {
                "### $(Split-Path $dir -Leaf) / $file" >> $env:GITHUB_STEP_SUMMARY
                '```text' >> $env:GITHUB_STEP_SUMMARY
                Get-Content -LiteralPath $path >> $env:GITHUB_STEP_SUMMARY
                '```' >> $env:GITHUB_STEP_SUMMARY
              }
            }
          }
          if ($env:HISTORY_SMOKE_DIR -and (Test-Path -LiteralPath $env:HISTORY_SMOKE_DIR)) {
            Get-ChildItem -LiteralPath $env:HISTORY_SMOKE_DIR -Filter 'history-*' -File | ForEach-Object {
              "### History / $($_.Name)" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content -LiteralPath $_.FullName >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
          if ($env:WB_SMOKE_DIR -and (Test-Path -LiteralPath $env:WB_SMOKE_DIR)) {
            Get-ChildItem -LiteralPath $env:WB_SMOKE_DIR -Filter 'wb-*' -File | ForEach-Object {
              "### White balance / $($_.Name)" >> $env:GITHUB_STEP_SUMMARY
              '```text' >> $env:GITHUB_STEP_SUMMARY
              Get-Content -LiteralPath $_.FullName >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
          }
          'Exposure uses committed synthetic JPEG/ICC fixtures and real packaged worker/canvas/SQLite. Pillow/LittleCMS fixture generation is not a CI/runtime dependency. The heavy 36 MP resource benchmark remains manual; see evidence/issue-12/report.md. Classification/availability-specific harnesses remain local, while core and import/relocation/exposure regressions run here.' >> $env:GITHUB_STEP_SUMMARY
          'Synthetic fixtures only. Native dialog replaced; no visual, physical keyboard, screen reader or executable double-click validation. makers: [] means no installers. No macOS check or end-user platform support claim. Package and local download caches disappear with the runner; no cache action or artifact upload.' >> $env:GITHUB_STEP_SUMMARY
